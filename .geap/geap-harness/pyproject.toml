[project]
name = "geap-harness"
version = "0.1.0"
description = "GEAP deterministic AI gate: Antigravity reviewer (SDK/CLI/offline) + pure-Python policy engine for CI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
geap-harness = "geap_harness.cli:app"

[project.optional-dependencies]
sdk = [
    "google-antigravity>=0.1.20",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geap_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
