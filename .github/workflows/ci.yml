name: CI — Tests & GEAP AI Gate

# The "GEAP AI Gate" job name IS the required check the GEAP pipeline polls (ci_check_name).
# Reviewer backend (vars.GEAP_GATE_BACKEND): cli (default, Antigravity `agy` CLI) | sdk | offline.
# There is NO silent fallback: if the agy CLI or GCP auth is missing the gate FAILS with the reason.
# `offline` (deterministic heuristics) must be selected explicitly and is meant for demo repos only.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Run pytest with JUnit XML
        env:
          APP_ENV: test
        run: |
          rm -f uv.lock
          uv run --default-index https://pypi.org/simple pytest -q --junitxml=junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: junit.xml
          if-no-files-found: error

  ai-review-gate:
    name: GEAP AI Gate
    needs: test
    if: always()
    runs-on: ubuntu-latest
    env:
      GEAP_GATE_BACKEND: ${{ vars.GEAP_GATE_BACKEND || 'cli' }}
      GEAP_HARNESS_REVIEW_MODEL: ${{ vars.GEAP_HARNESS_REVIEW_MODEL || 'gemini-3-flash-preview' }}
      GEAP_GATE_CACHE_URI: ${{ vars.GEAP_GATE_CACHE_URI }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_REGION }}
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      GEAP_HARNESS_SOURCE: ${{ vars.GEAP_HARNESS_SOURCE || 'geap-harness' }}
    steps:
      - name: Checkout full history for base..head diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Download JUnit report
        uses: actions/download-artifact@v4
        with:
          name: junit-xml
          path: .
        continue-on-error: true

      - name: Cache GEAP gate verdicts (.geap/cache)
        uses: actions/cache@v4
        with:
          path: .geap/cache
          key: geap-gate-cache-${{ runner.os }}-${{ hashFiles('.geap/policy.yaml') }}-${{ github.sha }}
          restore-keys: |
            geap-gate-cache-${{ runner.os }}-${{ hashFiles('.geap/policy.yaml') }}-

      - name: Check backend prerequisites
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          GEAP_CI_SA: ${{ vars.GEAP_CI_SA }}
        run: |
          set -euo pipefail
          case "$GEAP_GATE_BACKEND" in
            cli|sdk)
              if [ -z "${WIF_PROVIDER:-}" ] || [ -z "${GEAP_CI_SA:-}" ] || [ -z "${GOOGLE_CLOUD_PROJECT:-}" ]; then
                echo "::error::GEAP AI Gate backend '$GEAP_GATE_BACKEND' needs vars.WIF_PROVIDER, vars.GEAP_CI_SA and vars.GCP_PROJECT. Set vars.GEAP_GATE_BACKEND=offline explicitly for a demo repo."
                exit 1
              fi ;;
            offline)
              echo "::warning::GEAP AI Gate running the deterministic OFFLINE reviewer (demo only; no LLM review)." ;;
            *)
              echo "::error::unknown GEAP_GATE_BACKEND '$GEAP_GATE_BACKEND' (cli|sdk|offline)"; exit 1 ;;
          esac

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: ${{ (vars.GEAP_GATE_BACKEND || 'cli') != 'offline' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GEAP_CI_SA }}

      - name: Install Antigravity CLI (agy)
        if: ${{ (vars.GEAP_GATE_BACKEND || 'cli') == 'cli' }}
        env:
          GEAP_AGY_INSTALL: ${{ vars.GEAP_AGY_INSTALL }}
        run: |
          set -euo pipefail
          if ! command -v agy >/dev/null 2>&1; then
            if [ -z "${GEAP_AGY_INSTALL:-}" ]; then
              echo "::error::agy CLI not on PATH and vars.GEAP_AGY_INSTALL (install command) is not set"
              exit 1
            fi
            bash -c "$GEAP_AGY_INSTALL"
          fi
          agy --version

      - name: Run geap-harness gate
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -f uv.lock .geap/geap-harness/uv.lock
          EXTRA=""
          UV_EXTRA=()
          if [ "$GEAP_GATE_BACKEND" = "sdk" ]; then EXTRA="[sdk]"; UV_EXTRA=(--extra sdk); fi
          if [ -d ".geap/geap-harness" ]; then
            HARNESS=(uv run --default-index https://pypi.org/simple --project .geap/geap-harness "${UV_EXTRA[@]}" geap-harness)
          else
            HARNESS=(uvx --from "${GEAP_HARNESS_SOURCE}${EXTRA}" geap-harness)
          fi
          JUNIT=()
          if [ -f junit.xml ]; then JUNIT=(--junit junit.xml); fi
          "${HARNESS[@]}" gate \
            --repo-dir . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --policy .geap/policy.yaml \
            "${JUNIT[@]}" \
            --cache-dir .geap/cache \
            --backend "$GEAP_GATE_BACKEND" \
            --out gate.json

      - name: Upload gate.json verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geap-gate-verdict
          path: gate.json
          if-no-files-found: warn

      - name: Publish GEAP AI Gate summary & PR comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ ! -f gate.json ]; then
            echo "gate.json not found (gate step failed before producing a verdict)"
            exit 0
          fi
          if [ -d ".geap/geap-harness" ]; then
            HARNESS=(uv run --default-index https://pypi.org/simple --project .geap/geap-harness geap-harness)
          else
            HARNESS=(uvx --from "${GEAP_HARNESS_SOURCE}" geap-harness)
          fi
          "${HARNESS[@]}" publish --gate gate.json --sha "$HEAD_SHA"
