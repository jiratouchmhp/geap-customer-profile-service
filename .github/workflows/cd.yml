name: CD — Deploy to Cloud Run

# Dispatched by the GEAP pipeline (scm.dispatch_deploy) with inputs environment / ref / geap_run_id.
# The job's `environment:` makes GitHub record a Deployment the pipeline reads back
# (deployment_status). There is NO simulated deploy: missing GCP configuration fails the run.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]
      ref:
        description: "Git ref / SHA to deploy"
        required: true
        default: main
      geap_run_id:
        description: "GEAP pipeline run id (for traceability)"
        required: false
        default: ""

run-name: "CD ${{ inputs.environment }} @ ${{ inputs.ref }} (geap ${{ inputs.geap_run_id || 'manual' }})"

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.AR_REPO || 'geap-sdlc' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || github.event.repository.name }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.smoke.outputs.url }}
    outputs:
      url: ${{ steps.smoke.outputs.url }}
      revision: ${{ steps.deploy.outputs.revision }}
    steps:
      - name: Validate configuration
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          GEAP_CI_SA: ${{ vars.GEAP_CI_SA }}
        run: |
          set -euo pipefail
          missing=""
          for v in WIF_PROVIDER GEAP_CI_SA GCP_PROJECT GCP_REGION; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::CD needs repository variables:$missing"
            exit 1
          fi

      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GEAP_CI_SA }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        id: build
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${SERVICE_NAME}:${SHA::12}"
          gcloud builds submit . --project "${GCP_PROJECT}" --tag "${IMAGE}" --quiet
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          TARGET_ENV: ${{ inputs.environment }}
          IMAGE: ${{ steps.build.outputs.image }}
          GEAP_RUN_ID: ${{ inputs.geap_run_id }}
        run: |
          set -euo pipefail
          SUFFIX="$([ "$TARGET_ENV" = "production" ] && echo prod || echo staging)"
          SVC="${SERVICE_NAME}-${SUFFIX}"
          gcloud run deploy "${SVC}" \
            --project "${GCP_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE}" \
            --set-env-vars "APP_ENV=${SUFFIX},CPS_ENV=${SUFFIX}" \
            --labels "geap-run=$(echo "${GEAP_RUN_ID:-manual}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-63)" \
            --quiet
          URL="$(gcloud run services describe "${SVC}" --project "${GCP_PROJECT}" --region "${GCP_REGION}" --format='value(status.url)')"
          REV="$(gcloud run services describe "${SVC}" --project "${GCP_PROJECT}" --region "${GCP_REGION}" --format='value(status.latestReadyRevisionName)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"

      - name: Smoke test /healthz
        id: smoke
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          TOKEN="$(gcloud auth print-identity-token)"
          RESP="$(curl -fsS --retry 5 --retry-delay 3 -H "Authorization: Bearer ${TOKEN}" "${URL}/healthz")"
          echo "/healthz: ${RESP}"
          echo "${RESP}" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Summary
        if: always()
        run: |
          {
            echo "### GEAP CD"
            echo "- environment: ${{ inputs.environment }}"
            echo "- ref: ${{ inputs.ref }}"
            echo "- geap_run_id: ${{ inputs.geap_run_id }}"
            echo "- url: ${{ steps.deploy.outputs.url }}"
            echo "- revision: ${{ steps.deploy.outputs.revision }}"
          } >> "$GITHUB_STEP_SUMMARY"
